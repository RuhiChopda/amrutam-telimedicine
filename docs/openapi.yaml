components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT (ES256)
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9_\-:.]+$
      description: 'Client-generated unique key (UUID recommended). Retrying with the same key and payload returns the original response (`Idempotent-Replayed:
        true`); same key with a different payload returns 422.'
  responses:
    Problem:
      description: Error (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
      required:
      - status
      - code
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
        fullName:
          type: string
        phone:
          type: string
        role:
          type: string
          enum:
          - patient
          - doctor
        doctor:
          type: object
          properties:
            licenseNumber:
              type: string
            specialties:
              type: array
              items:
                type: string
            languages:
              type: array
              items:
                type: string
            city:
              type: string
            bio:
              type: string
            yearsExperience:
              type: integer
            consultationFeeMinor:
              type: integer
          required:
          - licenseNumber
          - specialties
          - consultationFeeMinor
      required:
      - email
      - password
      - fullName
    RegisterResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
        status:
          type: string
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
      - email
      - password
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
    LoginResult:
      oneOf:
      - allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          properties:
            mfaRequired:
              type: boolean
              enum:
              - false
            mfaEnrollmentRequired:
              type: boolean
            user:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                role:
                  type: string
                mfaEnabled:
                  type: boolean
      - type: object
        properties:
          mfaRequired:
            type: boolean
            enum:
            - true
          mfaToken:
            type: string
    MfaVerifyRequest:
      type: object
      properties:
        mfaToken:
          type: string
        code:
          type: string
          pattern: ^\d{6}$
        recoveryCode:
          type: string
      required:
      - mfaToken
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required:
      - refreshToken
    MfaEnrollment:
      type: object
      properties:
        secret:
          type: string
        otpauthUrl:
          type: string
    MfaActivateRequest:
      type: object
      properties:
        code:
          type: string
          pattern: ^\d{6}$
      required:
      - code
    MfaActivated:
      allOf:
      - $ref: '#/components/schemas/TokenPair'
      - type: object
        properties:
          recoveryCodes:
            type: array
            items:
              type: string
    PasswordChangeRequest:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
      required:
      - currentPassword
      - newPassword
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
        mfaEnabled:
          type: boolean
        email:
          type: string
        profile:
          type: object
          properties:
            fullName:
              type: string
            phone:
              type: string
            dateOfBirth:
              type: string
            gender:
              type: string
            locale:
              type: string
            timezone:
              type: string
    ProfileUpdate:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        dateOfBirth:
          type: string
        gender:
          type: string
        locale:
          type: string
        timezone:
          type: string
    Doctor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        bio:
          type: string
        specialties:
          type: array
          items:
            type: string
        languages:
          type: array
          items:
            type: string
        city:
          type: string
        yearsExperience:
          type: integer
        consultationFee:
          type: object
          properties:
            amountMinor:
              type: integer
            currency:
              type: string
        rating:
          type: object
          properties:
            average:
              type: number
            count:
              type: integer
        nextAvailableAt:
          type: string
          format: date-time
    DoctorSelf:
      allOf:
      - $ref: '#/components/schemas/Doctor'
      - type: object
        properties:
          licenseNumber:
            type: string
          verificationStatus:
            type: string
    DoctorPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Doctor'
        nextCursor:
          type: string
    DoctorUpdate:
      type: object
      properties:
        displayName:
          type: string
        bio:
          type: string
        specialties:
          type: array
          items:
            type: string
        languages:
          type: array
          items:
            type: string
        city:
          type: string
        yearsExperience:
          type: integer
        consultationFeeMinor:
          type: integer
    AvailabilityRequest:
      type: object
      properties:
        windows:
          type: array
          items:
            type: object
            properties:
              start:
                type: string
                format: date-time
              end:
                type: string
                format: date-time
            required:
            - start
            - end
        slotMinutes:
          type: integer
          enum:
          - 10
          - 15
          - 20
          - 30
          - 45
          - 60
      required:
      - windows
      - slotMinutes
    AvailabilityResult:
      type: object
      properties:
        requested:
          type: integer
        created:
          type: integer
        skippedOverlapping:
          type: integer
    OwnSlots:
      type: object
      properties:
        slots:
          type: array
          items:
            type: object
            properties:
