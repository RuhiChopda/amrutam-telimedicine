name: ci
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests with coverage (fresh DB, migrations from scratch)
        run: npm run test:coverage
        env: { TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/amrutam_test" }
      - name: Validate OpenAPI contract and that it matches the implemented routes
        run: npx tsx scripts/check-openapi.ts
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage/lcov.info }

  security:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Dependency audit (fails on high/critical in production deps)
        run: npm run audit:deps
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: SAST (CodeQL)
        uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
      - name: IaC scan (Terraform + Kubernetes + Dockerfile)
        uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: config, scan-ref: ., severity: "HIGH,CRITICAL", exit-code: "1" }

  image:
    needs: [verify, security]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build (no push) for scanning
        uses: docker/build-push-action@v7
        with: { context: ., load: true, tags: "amrutam-backend:${{ github.sha }}", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Image vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "amrutam-backend:${{ github.sha }}", severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1" }
      - name: SBOM
        uses: anchore/sbom-action@v0
        with: { image: "amrutam-backend:${{ github.sha }}", format: cyclonedx-json, output-file: sbom.cdx.json }
      - name: Push (main only)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with: { context: ., push: true, provenance: true, sbom: true, tags: "ghcr.io/${{ github.repository }}:${{ github.sha }}", cache-from: type=gha }

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: [image]
    runs-on: ubuntu-latest
    environment: staging          # protected environment: required reviewers / wait timer configured in GitHub
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4   # OIDC: no long-lived cloud keys in CI
        with: { role-to-assume: "${{ vars.DEPLOY_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION }}" }
      - run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER }}"
      - name: Migrate (Job) then roll out (zero-downtime, expand/contract migrations only)
        run: |
          cd infra/k8s
          kustomize edit set image amrutam-backend="ghcr.io/${{ github.repository }}:${{ github.sha }}"
          kubectl delete job amrutam-migrate -n amrutam --ignore-not-found
          kustomize build . | kubectl apply -f -
          kubectl wait --for=condition=complete job/amrutam-migrate -n amrutam --timeout=300s
          kubectl rollout status deploy/amrutam-api -n amrutam --timeout=300s
          kubectl rollout status deploy/amrutam-worker -n amrutam --timeout=300s
      - name: Smoke test
        run: curl -fsS "${{ vars.STAGING_URL }}/readyz"
