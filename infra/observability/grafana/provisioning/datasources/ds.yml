apiVersion: 1
datasources:
  - { name: Prometheus, type: prometheus, uid: prom, url: http://prometheus:9090, isDefault: true }
  - { name: Loki, type: loki, uid: loki, url: http://loki:3100,
      jsonData: { derivedFields: [{ name: trace, matcherRegex: '"traceId":"(\w+)"', url: '$${__value.raw}', datasourceUid: jaeger }] } }
  - { name: Jaeger, type: jaeger, uid: jaeger, url: http://jaeger:16686 }
