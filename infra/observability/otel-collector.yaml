receivers:
  otlp: { protocols: { http: { endpoint: 0.0.0.0:4318 }, grpc: { endpoint: 0.0.0.0:4317 } } }
processors:
  batch: {}
  # tail-sample in production: keep all errors and slow traces, 10% of the rest (cost control at 100k consults/day)
  tail_sampling:
    decision_wait: 10s
    policies:
      - { name: errors, type: status_code, status_code: { status_codes: [ERROR] } }
      - { name: slow, type: latency, latency: { threshold_ms: 400 } }
      - { name: sample, type: probabilistic, probabilistic: { sampling_percentage: 10 } }
exporters:
  otlp/jaeger: { endpoint: jaeger:4317, tls: { insecure: true } }
service:
  pipelines:
    traces: { receivers: [otlp], processors: [tail_sampling, batch], exporters: [otlp/jaeger] }
